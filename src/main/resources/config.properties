# Cấu hình ứng dụng QuanLyNhanThan
# Giá trị ở đây có thể bị ghi đè bởi biến môi trường.
# Mật khẩu Neo4j cần được cung cấp qua biến môi trường NEO4J_PASSWORD.

# Kết nối Neo4j
neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
neo4j.database=neo4j

# Web server
server.port=8080

# Tự động seed dữ liệu khi DB rỗng
app.seed.ifEmpty=true
